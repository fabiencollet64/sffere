# Déploiement GitHub Pages : publie la racine du dépôt à chaque push sur main.
# Prérequis : Settings → Pages → Source : « GitHub Actions ».
name: Déployer la maquette sur GitHub Pages
on:
  push:
    branches: [main, claude/cool-meitner-4kebs2]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
